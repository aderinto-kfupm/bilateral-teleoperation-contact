[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "pybullet"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["teleop"]

[tool.ruff]
line-length = 100
